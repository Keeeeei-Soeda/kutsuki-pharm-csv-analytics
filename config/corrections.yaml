# 生データの補正定義。
#
# 原則:
#   - data/raw/ は絶対に書き換えない。生データ + この補正定義 = 分析用データ。
#   - 全置換（sed 等）は禁止。必ず key で該当レコードのみを更新する。
#   - key が1件にマッチしないときは例外にする（静かな取りこぼしを防ぐ）。
#
# 運用:
#   1. 補正内容が確定するまで enabled: false のままにしておく。
#   2. 確定したら enabled: true と applied_at を書き、
#      `python3 -m src.corrections` を実行して reports/correction_impact.md を確認する。
#
# propagate_to:
#   同じ列を持つ他ファイルにも同じ補正を波及させる。
#   クリニック→薬局の距離は clinic_master 以外にも実体として入っており、
#   1ファイルだけ直すと分析間で数値が食い違う。
#
# 距離を補正すると visit_triangle の門前フラグ・立地パターンは読み込み時に再判定される
# （基準は config/economics.yaml の gate_distance_km、実装は src/corrections.py）。

_all_distance_files: &all_distance_files
  - clinic_master_from_prescriptions
  - visit_history
  - visit_history_with_weather_pollen
  - visit_triangle
  - patient_clinic_with_distance

